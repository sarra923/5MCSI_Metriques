<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualisation des Commits - Commit Tracker</title>
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body {
            background: linear-gradient(to top, #00aaff, #004d99);
            font-family: 'Roboto', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333;
        }
        h1 {
            font-size: 2.2em;
            color: #fff;
            margin-bottom: 30px;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.5);
            font-weight: 300;
        }
        #chart-container {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.4);
            width: 80%;
            max-width: 800px;
            text-align: center;
        }
        #piechart {
            width: 100%;
            height: 500px;
            border: 5px solid #00aaff;
            border-radius: 15px;
            background: #f9f9f9;
            animation: bounceIn 1.5s ease-in-out;
        }
        @keyframes bounceIn {
            0% {
                opacity: 0;
                transform: scale(0.8);
            }
            60% {
                opacity: 1;
                transform: scale(1.1);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }
        footer {
            margin-top: 40px;
            font-size: 1em;
            text-align: center;
            color: #fff;
        }
        .footer-link {
            color: #ffeb3b;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s;
        }
        .footer-link:hover {
            color: #ff9800;
            text-decoration: underline;
        }
    </style>
    <script type="text/javascript">
        // Charger Google Charts
        google.charts.load('current', { packages: ['corechart'] });
        google.charts.setOnLoadCallback(fetchCommits);

        // Fonction pour dessiner le graphique
        function drawChart(commitMinutes) {
            var data = google.visualization.arrayToDataTable(commitMinutes);

            var options = {
                title: 'Distribution des Commits par Minute',
                titleTextStyle: {
                    color: '#333',
                    fontSize: 20,
                    bold: true
                },
                backgroundColor: 'transparent',
                pieSliceText: 'percentage',
                legend: {
                    position: 'bottom',
                    textStyle: {
                        color: '#333',
                        fontSize: 12
                    }
                },
                pieSliceBorderColor: '#fff',
                slices: {
                    0: { offset: 0.1 },
                    1: { offset: 0.1 },
                    2: { offset: 0.1 }
                },
                pieHole: 0.4,
                colors: ['#FF4500', '#FF6347', '#FFD700', '#20B2AA', '#9370DB', '#00CED1', '#7FFF00', '#D2691E']
            };

            var chart = new google.visualization.PieChart(document.getElementById('piechart'));
            chart.draw(data, options);
        }

        // Fonction pour extraire les commits depuis l'API GitHub
        function fetchCommits() {
            const url = 'https://api.github.com/repos/OpenRSI/5MCSI_Metriques/commits';

            fetch(url)
                .then(response => response.json())
                .then(commits => {
                    let commitMinutes = [['Minute', 'Nombre de Commits']];
                    let minuteCount = Array(60).fill(0);

                    commits.forEach(commit => {
                        const commitDate = new Date(commit.commit.author.date);
                        const minute = commitDate.getMinutes();
                        minuteCount[minute]++;
                    });

                    for (let i = 0; i < minuteCount.length; i++) {
                        if (minuteCount[i] > 0) {
                            commitMinutes.push([i.toString() + ' min', minuteCount[i]]);
                        }
                    }

                    drawChart(commitMinutes);
                })
                .catch(error => console.error('Erreur lors de la récupération des commits :', error));
        }
    </script>
</head>
<body>

    <h1>Analyse des Commits</h1>
    <div id="chart-container">
        <div id="piechart"></div>
    </div>

    <footer>
        Créé avec ♥ par <a class="footer-link" href="https://github.com/votreusername" target="_blank">Sarra BEJAOUI/a> | Données fournies par GitHub API
    </footer>

</body>
</html>
